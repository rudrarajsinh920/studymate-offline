# Render Blueprint for StudyMate Offline
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: studymate-offline
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/studymate.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: OLLAMA_BASE_URL
        value: https://der-learners-birth-relevant.trycloudflare.com
      - key: OLLAMA_LLM_MODEL
        value: llama3.2:3b
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_TIMEOUT_MS
        value: "300000"
      - key: OLLAMA_MAX_TOKENS
        value: "512"
      - key: GEMINI_API_KEY
        sync: false
